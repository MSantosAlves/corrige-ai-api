name: Production Deploy (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            msantosalves404/revisa-facil:backend-latest
            msantosalves404/revisa-facil:backend-${{ github.sha }}

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            export BACKEND_ENV_FILE=./deploy/env/backend.production.env
            export OCR_ENV_FILE=./deploy/env/ocr.production.env
            export BACKEND_IMAGE=msantosalves404/revisa-facil:backend-latest
            export OCR_IMAGE=msantosalves404/revisa-facil:ocr-latest
            docker compose pull
            docker compose up -d
